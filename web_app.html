<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Mini App</title>
    <!-- 1. Подключение Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        /* Темный стеклянный UI (Glassmorphism) */
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text-color: #f8fafc;
            --accent-color: #6366f1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 12px;
            font-weight: 600;
        }

        p {
            font-size: 0.95rem;
            opacity: 0.8;
            margin-bottom: 24px;
        }

        .btn {
            width: 100%;
            padding: 14px 20px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.8) 0%, rgba(168, 85, 247, 0.8) 100%);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
            margin-bottom: 12px;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
        }

        #status {
            margin-top: 16px;
            font-size: 0.9rem;
            color: #38bdf8;
            word-break: break-word;
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <h1 id="user-greeting">Привет 👋</h1>
        <p>Нажимай на кнопки ниже — приложение больше не будет закрываться само по себе.</p>

        <!-- type="button" предотвращает отправку формы и перезагрузку страницы -->
        <button type="button" class="btn" id="action-btn">Выполнить действие</button>
        <button type="button" class="btn btn-secondary" id="close-btn">Закрыть приложение</button>

        <div id="status"></div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram?.WebApp;

        if (tg) {
            // Оповещаем Telegram, что приложение полностью загрузилось
            tg.ready();
            // Раскрываем окно Mini App на всю высоту экрана
            tg.expand();

            // Если доступна информация о пользователе
            const user = tg.initDataUnsafe?.user;
            if (user) {
                document.getElementById('user-greeting').innerText = `Привет, ${user.first_name}! 👋`;
            }
        }

        // Обработчик основной кнопки (НЕ закрывает приложение)
        document.getElementById('action-btn').addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();

            const statusDiv = document.getElementById('status');
            statusDiv.innerText = "✅ Действие выполнено! Окно осталась открытым.";

            // Если нужно отправить данные на ваш бэкенд:
            /*
            fetch('https://ваш-сервер.com/api/do-something', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ initData: tg.initData })
            });
            */
        });

        // Кнопка, которая закрывает приложение ТОЛЬКО по вашему требованию
        document.getElementById('close-btn').addEventListener('click', function(e) {
            e.preventDefault();
            if (tg) {
                tg.close();
            }
        });
    </script>
</body>
</html>
