<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SwiWallet Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text-color: #f8fafc;
            --accent-color: #6366f1;
            --success-color: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            color: var(--text-color);
            padding: 12px;
            overflow-x: hidden;
        }

        body.light {
            background: linear-gradient(160deg, #f6f5fc 0%, #eceafa 100%);
            color: #17172a;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        body.light .card {
            background: rgba(255, 255, 255, .55);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 12px;
            font-weight: 600;
            text-align: center;
        }

        p {
            font-size: 0.95rem;
            opacity: 0.8;
            margin-bottom: 16px;
            text-align: center;
        }

        body.light .sub {
            color: #63637a;
        }

        .balance-section {
            text-align: center;
            margin-bottom: 20px;
            padding: 12px;
            background: rgba(99, 102, 241, 0.1);
            border-radius: 14px;
        }

        body.light .bal {
            background: rgba(255, 255, 255, .5);
        }

        .balance-amount {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 4px;
        }

        body.light .sum {
            color: #5a5fd8;
        }

        .balance-label {
            font-size: 0.85rem;
            opacity: 0.7;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }

        .btn {
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.8) 0%, rgba(168, 85, 247, 0.8) 100%);
            color: #fff;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .btn:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
        }

        .btn-full {
            grid-column: 1 / -1;
        }

        .qr-section {
            text-align: center;
        }

        .qr-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .status {
            margin-top: 16px;
            padding: 12px;
            border-radius: 10px;
            font-size: 0.9rem;
            background: rgba(16, 185, 129, 0.1);
            color: var(--success-color);
            text-align: center;
            word-break: break-word;
            display: none;
        }

        .status.show {
            display: block;
        }

        .status.error {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }

        .sheet {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px 24px 0 0;
            padding: 20px;
            max-height: 90vh;
            overflow-y: auto;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .sheet.open {
            transform: translateY(0);
        }

        body.light .sbox {
            background: #f4f3fb;
            color: #17172a;
        }

        .sheet h3 {
            font-size: 1.2rem;
            margin-bottom: 16px;
            text-align: center;
        }

        .sheet-content {
            margin-bottom: 16px;
        }

        .inp {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            color: var(--text-color);
            font-size: 0.95rem;
            margin-bottom: 12px;
        }

        body.light .sbox input,
        body.light .sbox select {
            background: rgba(0, 0, 0, .05);
            color: #17172a;
        }

        .inp::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            color: var(--text-color);
            font-size: 0.95rem;
            margin-bottom: 12px;
        }

        #qrBox {
            display: flex;
            justify-content: center;
            padding: 16px;
            background: #fff;
            border-radius: 14px;
            margin-bottom: 12px;
        }

        #qrBox canvas {
            max-width: 100%;
        }

        .addr {
            word-break: break-all;
            font-size: 0.8rem;
            opacity: 0.7;
            margin-bottom: 12px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
        }

        body.light .addr,
        body.light .feebox {
            background: rgba(0, 0, 0, .04);
            color: #17172a;
        }

        .sheet .btn {
            grid-column: auto;
        }

        .sheet-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .side {
            margin: 0 0 14px;
        }

        .gray {
            background: rgba(255, 255, 255, 0.08) !important;
        }

        body.light .btn.gray {
            background: rgba(0, 0, 0, .06) !important;
            color: #55556a;
        }

        .sec {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 0 2px 8px;
        }

        .sec b {
            font-size: 15px;
        }

        .sec div {
            display: flex;
            gap: 10px;
        }

        .sec button {
            border: none;
            background: none;
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            cursor: pointer;
        }

        @media (max-width: 420px) {
            .card, .sbox {
                backdrop-filter: blur(8px);
                -webkit-backdrop-filter: blur(8px);
            }
        }

        #toast {
            position: fixed;
            top: 14px;
            left: 50%;
            transform: translateX(-50%) translateY(-90px);
            transition: transform 0.3s;
            z-index: 100;
            padding: 10px 18px;
            border-radius: 14px;
            background: #1d1836;
            border: 1px solid var(--glass-border);
            font-size: 13px;
            white-space: nowrap;
            max-width: 92%;
        }

        #toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Главная карточка -->
        <div class="glass-card">
            <h1 id="user-greeting">Привет 👋</h1>
            <p id="welcome-text">Добро пожаловать в SwiWallet</p>

            <!-- Баланс -->
            <div class="balance-section">
                <div class="balance-amount">$1,250.50</div>
                <div class="balance-label" id="balSub">Ваш баланс (USD)</div>
            </div>

            <!-- Основные кнопки -->
            <div class="btn-group">
                <button type="button" class="btn" id="depositBtn">💵 Пополнить</button>
                <button type="button" class="btn" id="withdrawBtn">📤 Вывести</button>
            </div>

            <div class="btn-group">
                <button type="button" class="btn" id="transferBtn">↔️ Перевод</button>
                <button type="button" class="btn" id="historyBtn">📊 История</button>
            </div>

            <!-- QR функции -->
            <div class="qr-section">
                <div class="qr-buttons">
                    <button type="button" class="btn" id="qrScanBtn">📷 Сканер</button>
                    <button type="button" class="btn" id="qrMyBtn">🔳 Мой QR</button>
                </div>
            </div>

            <!-- Статус -->
            <div class="status" id="status"></div>
        </div>
    </div>

    <div class="sec">
        <b id="assets-title">Мои активы</b>
        <div>
            <button type="button" id="langBtn" style="border:none;background:none;color:rgba(255,255,255,0.6);font-size:13px;margin-right:10px;cursor:pointer">🌐 EN</button>
            <button type="button" id="hideSmallBtn">Скрыть мелкие</button>
        </div>
    </div>

    <!-- Шторка "Мой QR" -->
    <div class="sheet" id="qrSheet">
        <div class="sheet-content">
            <h3>📱 Мой QR для приёма</h3>
            
            <select id="qrCoin">
                <option>TON</option>
                <option>USDT</option>
                <option>ETH</option>
                <option>BTC</option>
                <option>BNB</option>
            </select>

            <input type="number" class="inp" id="qrAmt" step="any" placeholder="Сумма (необязательно)">

            <div id="qrBox" style="display:flex;justify-content:center;padding:12px;background:#fff;border-radius:14px;margin-bottom:10px"></div>

            <div class="addr" id="qrUri"></div>

            <div class="sheet-buttons">
                <button type="button" class="btn" id="qrCopy">📋 Копировать</button>
                <button type="button" class="btn gray" onclick="closeSheet('qrSheet')">✕ Закрыть</button>
            </div>
        </div>
    </div>

    <!-- Оверлей -->
    <div class="overlay" id="overlay"></div>
    <div id="toast"></div>

    <script>
        // Telegram WebApp API
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            const user = tg.initDataUnsafe?.user;
            if (user) {
                document.getElementById('user-greeting').innerText = `Привет, ${user.first_name}! 👋`;
            }
        }

        // Вспомогательные функции
        function haptic() {
            tg?.HapticFeedback?.impactOccurred?.('light');
        }

        function toast(msg) {
            const status = document.getElementById('toast');
            status.textContent = msg;
            status.classList.add('show');
            clearTimeout(status._h);
            status._h = setTimeout(() => status.classList.remove('show'), 2200);
        }

        function lsGet(k, d) {
            try {
                const v = localStorage.getItem(k);
                return v == null ? d : JSON.parse(v);
            } catch (e) {
                return d;
            }
        }

        function lsSet(k, v) {
            try {
                localStorage.setItem(k, JSON.stringify(v));
            } catch (e) {}
        }

        function note(m) {
            document.getElementById('status').textContent = m;
        }

        function _openSheet(id) {
            document.getElementById(id).classList.add('open');
            document.getElementById('overlay').classList.add('show');
        }

        function _closeSheet(id) {
            document.getElementById(id).classList.remove('open');
            document.getElementById('overlay').classList.remove('show');
        }

        function openSheet(id) {
            haptic();
            _openSheet(id);
            try {
                tg.BackButton.show();
            } catch (e) {}
        }

        function closeSheet(id) {
            haptic();
            _closeSheet(id);
            if (!document.querySelector('.sheet.open')) {
                try {
                    tg.BackButton.hide();
                } catch (e) {}
            }
        }

        // ===== БЛОК C: i18n, тема, оффлайн, BackButton =====
        var UNAME = (tg?.initDataUnsafe?.user?.first_name) || 'друг';
        var LANG = lsGet('swz_lang', 'ru');
        var I18N = {
            ru: {
                dep: '💵 Пополнить',
                wd: '📤 Вывести',
                tr: '🔁 Перевод',
                hist: '📊 История',
                scan: '📷 Сканер',
                qr: '🔳 Мой QR',
                assets: 'Мои активы',
                hide: 'Скрыть мелкие',
                show: 'Показать мелкие',
                bal: 'Ваш баланс (USD)',
                welcome: 'Добро пожаловать в SwiWallet',
                hello: 'Привет, ' + UNAME + '! 👋',
                lang: '🌐 EN'
            },
            en: {
                dep: '💵 Deposit',
                wd: '📤 Withdraw',
                tr: '🔁 Transfer',
                hist: '📊 History',
                scan: '📷 Scanner',
                qr: '🔳 My QR',
                assets: 'My assets',
                hide: 'Hide small',
                show: 'Show small',
                bal: 'Your balance (USD)',
                welcome: 'Welcome to SwiWallet',
                hello: 'Hello, ' + UNAME + '! 👋',
                lang: '🌐 RU'
            }
        };

        function applyLang() {
            const d = I18N[LANG];
            document.getElementById('depositBtn').textContent = d.dep;
            document.getElementById('withdrawBtn').textContent = d.wd;
            document.getElementById('transferBtn').textContent = d.tr;
            document.getElementById('historyBtn').textContent = d.hist;
            document.getElementById('qrScanBtn').textContent = d.scan;
            document.getElementById('qrMyBtn').textContent = d.qr;
            document.getElementById('user-greeting').textContent = d.hello;
            document.getElementById('balSub').textContent = d.bal;
            document.getElementById('welcome-text').textContent = d.welcome;
            document.getElementById('assets-title').textContent = d.assets;
            document.getElementById('langBtn').textContent = d.lang;
        }

        document.getElementById('langBtn').onclick = function() {
            LANG = LANG === 'ru' ? 'en' : 'ru';
            lsSet('swz_lang', LANG);
            applyLang();
        };

        function applyTheme() {
            try {
                const isLight = tg?.colorScheme === 'light';
                document.body.classList.toggle('light', isLight);
            } catch (e) {}
        }

        applyTheme();
        try {
            tg.onEvent('themeChanged', applyTheme);
        } catch (e) {}

        // Оффлайн/онлайн
        window.addEventListener('offline', function() {
            note('📴 Нет сети — показан локальный баланс');
        });
        window.addEventListener('online', function() {
            note('🟢 Сеть восстановлена');
        });

        // BackButton
        try {
            tg.BackButton.onClick(function() {
                document.querySelectorAll('.sheet.open').forEach(function(s) {
                    _closeSheet(s.id);
                });
                try {
                    tg.BackButton.hide();
                } catch (e) {}
            });
        } catch (e) {}

        applyLang();

        // ===== QR: приём и отправка =====
        const COINS = [
            { sym: 'TON', fmt: 'ton', name: 'TON' },
            { sym: 'USDT', fmt: 'evm', name: 'USDT' },
            { sym: 'ETH', fmt: 'evm', name: 'Ethereum' },
            { sym: 'BTC', fmt: 'btc', name: 'Bitcoin' },
            { sym: 'BNB', fmt: 'evm', name: 'BNB' }
        ];

        const FMT2COIN = { evm: 'ETH', ton: 'TON', btc: 'BTC', sol: 'SOL' };
        const UID = tg?.initDataUnsafe?.user?.id || 777;

        const TEST_ADDRS = {
            TON: 'EQA7jzPYHQQmvO2VD-3swBSJ5ZI8gR67c_IVtYt4UmE4F',
            USDT: '0x1234567890123456789012345678901234567890',
            ETH: '0x9876543210987654321098765432109876543210',
            BTC: '1A1z7agoat2ypExWySpzy3tiYjq6WEvqUA',
            BNB: '0xaBcD1234567890aBcD1234567890aBcD123456'
        };

        function coin(sym) {
            return COINS.find(c => c.sym === sym) || COINS[0];
        }

        function genAddr(fmt, seed) {
            return TEST_ADDRS[fmt === 'evm' ? 'ETH' : fmt === 'ton' ? 'TON' : fmt.toUpperCase()] || '0x' + Math.random().toString(16).slice(2);
        }

        function qamt(q) {
            if (!q) return 0;
            const p = {};
            new URLSearchParams(q.replace(/^\?/, '')).forEach((v, k) => p[k] = v);
            return parseFloat(p.amount || p.value || 0) || 0;
        }

        function parseQR(s) {
            s = String(s).trim();
            let m;
            if (m = s.match(/^bitcoin:([a-zA-Z0-9\-]+)(\?.*)?$/i))
                return { coin: 'BTC', addr: m[1], amt: qamt(m[2]) };
            if (m = s.match(/^ethereum:(0x[a-fA-F0-9]+)(\?.*)?$/i))
                return { coin: 'ETH', addr: m[1], amt: qamt(m[2]) };
            if (m = s.match(/^ton:\/\/transfer\/([A-Za-z0-9_\-]+)(\?.*)?$/i))
                return { coin: 'TON', addr: m[1], amt: qamt(m[2]) };
            return null;
        }

        function handleQR(s) {
            const p = parseQR(s);
            if (p) {
                toast(`✅ QR распознан: ${p.coin}`);
            } else {
                toast('❌ QR не распознан');
            }
        }

        document.getElementById('qrScanBtn').onclick = function() {
            haptic();
            if (tg?.showScanQRPopup) {
                tg.showScanQRPopup(
                    { text: 'Наведи камеру на QR' },
                    function(data) {
                        handleQR(data);
                        return true;
                    }
                );
            } else {
                toast('⚠️ Сканер недоступен в этом клиенте');
            }
        };

        function renderMyQR() {
            const c = coin(document.getElementById('qrCoin').value);
            const a = parseFloat(document.getElementById('qrAmt').value) || 0;
            const addr = genAddr(c.fmt, UID + c.sym.charCodeAt(0));
            
            let uri;
            if (c.sym === 'TON')
                uri = 'ton://transfer/' + addr + (a ? '?amount=' + a : '');
            else if (c.sym === 'BTC')
                uri = 'bitcoin:' + addr + (a ? '?amount=' + a : '');
            else if (c.fmt === 'evm')
                uri = 'ethereum:' + addr + (a ? '?value=' + a : '');
            else
                uri = 'https://switzerwallet.duckdns.org/pay/' + UID + '?coin=' + c.sym + (a ? '&amount=' + a : '');

            document.getElementById('qrUri').textContent = uri;
            
            const box = document.getElementById('qrBox');
            box.innerHTML = '';
            if (window.QRCode) {
                new QRCode(box, {
                    text: uri,
                    width: 220,
                    height: 220,
                    correctLevel: QRCode.CorrectLevel.M
                });
            }
        }

        document.getElementById('qrMyBtn').onclick = function() {
            haptic();
            renderMyQR();
            openSheet('qrSheet');
        };

        document.getElementById('qrCoin').onchange = renderMyQR;
        document.getElementById('qrAmt').oninput = renderMyQR;

        document.getElementById('qrCopy').onclick = function() {
            const u = document.getElementById('qrUri').textContent;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(u).then(() => {
                    toast('✅ Ссылка скопирована');
                });
            } else {
                toast('📋 ' + u);
            }
        };

        // Остальные кнопки (заглушки)
        document.getElementById('depositBtn').onclick = function() {
            haptic();
            toast('💵 Функция пополнения — этап 2');
        };

        document.getElementById('withdrawBtn').onclick = function() {
            haptic();
            toast('📤 Функция вывода — этап 2');
        };

        document.getElementById('transferBtn').onclick = function() {
            haptic();
            toast('↔️ Функция перевода — этап 2');
        };

        document.getElementById('historyBtn').onclick = function() {
            haptic();
            toast('📊 История транзакций — этап 2');
        };

        document.getElementById('hideSmallBtn').onclick = function() {
            toast('✅ Фильтр мелких активов');
        };

        // Закрытие шторки по клику на оверлей
        document.getElementById('overlay').onclick = function() {
            const sheet = document.querySelector('.sheet.open');
            if (sheet) {
                closeSheet(sheet.id);
            }
        };
    </script>
</body>
</html>
