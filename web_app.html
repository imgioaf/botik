<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Switzerbot Mini App</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(23, 32, 54, 0.6);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-purple: #8b5cf6;
      --accent-blue: #3b82f6;
      --accent-cyan: #06b6d4;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --glass-blur: blur(16px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.15) 0%, transparent 40%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 12px;
    }

    /* Мобильный контейнер для ПК и телефонов */
    .app-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 24px;
    }

    /* Шапка */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 4px;
    }

    .user-badge {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #fff;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
    }

    .user-info .username {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .user-info .status {
      font-size: 0.75rem;
      color: var(--accent-cyan);
    }

    .version-tag {
      font-size: 0.7rem;
      padding: 4px 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: var(--text-muted);
    }

    /* Баланс (Glassmorphic) */
    .balance-card {
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.12), rgba(59, 130, 246, 0.08));
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      position: relative;
      overflow: hidden;
    }

    .balance-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .balance-amount {
      font-size: 2.4rem;
      font-weight: 700;
      background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    /* Сетка действий */
    .section-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-left: 4px;
      margin-bottom: -6px;
    }

    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .action-btn {
      background: var(--card-bg);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .action-btn:active {
      transform: scale(0.97);
      background: rgba(255, 255, 255, 0.08);
    }

    .icon-wrapper {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    .deposit .icon-wrapper { background: rgba(16, 185, 129, 0.15); color: #10b981; }
    .withdraw .icon-wrapper { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
    .transfer .icon-wrapper { background: rgba(5b, 130, 246, 0.15); color: #3b82f6; }
    .history .icon-wrapper { background: rgba(139, 92, 246, 0.15); color: #8b5cf6; }

    .btn-label {
      font-size: 0.9rem;
      font-weight: 500;
    }

    /* Модальное окно */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 100;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-card {
      background: #111827;
      border: 1px solid var(--card-border);
      border-radius: 24px 24px 0 0;
      width: 100%;
      max-width: 440px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      animation: slideUp 0.25s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .close-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
    }

    .input-field {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      padding: 12px 16px;
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    .input-field:focus {
      border-color: var(--accent-purple);
    }

    .submit-btn {
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
    }

    .submit-btn:active {
      opacity: 0.9;
    }

    /* Список истории */
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 200px;
      overflow-y: auto;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 10px;
      font-size: 0.85rem;
    }

    .history-item .val-plus { color: #10b981; }
    .history-item .val-minus { color: #ef4444; }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Шапка приложения -->
    <div class="header">
      <div class="user-badge">
        <div class="avatar" id="userAvatar">U</div>
        <div class="user-info">
          <div class="username" id="userName">Пользователь</div>
          <div class="status">● Switzerbot Connected</div>
        </div>
      </div>
      <div class="version-tag">v2.5 Mini App</div>
    </div>

    <!-- Карточка Баланса -->
    <div class="balance-card">
      <div class="balance-label">Текущий баланс</div>
      <div class="balance-amount" id="balanceValue">$1,234.56</div>
    </div>

    <!-- Быстрые действия -->
    <div class="section-title">Быстрые операции</div>
    <div class="actions-grid">
      <div class="action-btn deposit" onclick="openModal('deposit')">
        <div class="icon-wrapper">📥</div>
        <span class="btn-label">Пополнить</span>
      </div>

      <div class="action-btn withdraw" onclick="openModal('withdraw')">
        <div class="icon-wrapper">📤</div>
        <span class="btn-label">Вывести</span>
      </div>

      <div class="action-btn transfer" onclick="openModal('transfer')">
        <div class="icon-wrapper">🔄</div>
        <span class="btn-label">Перевод</span>
      </div>

      <div class="action-btn history" onclick="openModal('history')">
        <div class="icon-wrapper">📜</div>
        <span class="btn-label">История</span>
      </div>
    </div>
  </div>

  <!-- Модальное окно -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">Заголовок</div>
        <button class="close-btn" onclick="closeModal()">✕</button>
      </div>
      <div id="modalBody">
        <!-- Динамический контент -->
      </div>
    </div>
  </div>

  <script>
    // Инициализация Telegram WebApp API
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand(); // Разворачиваем на весь экран в Telegram
      
      if (tg.initDataUnsafe?.user) {
        const user = tg.initDataUnsafe.user;
        document.getElementById('userName').innerText = user.first_name || 'Пользователь';
        document.getElementById('userAvatar').innerText = (user.first_name || 'U')[0].toUpperCase();
      }
    }

    let currentBalance = 1234.56;

    function updateBalanceDisplay() {
      document.getElementById('balanceValue').innerText = '$' + currentBalance.toFixed(2);
    }

    function openModal(type) {
      const overlay = document.getElementById('modalOverlay');
      const title = document.getElementById('modalTitle');
      const body = document.getElementById('modalBody');

      if (type === 'deposit') {
        title.innerText = 'Пополнение счета';
        body.innerHTML = `
          <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px;">Введите сумму пополнения ($):</p>
          <input type="number" id="depositAmount" class="input-field" placeholder="100" value="50">
          <button class="submit-btn" style="margin-top: 12px;" onclick="processDeposit()">Подтвердить пополнение</button>
        `;
      } else if (type === 'withdraw') {
        title.innerText = 'Вывод средств';
        body.innerHTML = `
          <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px;">Адрес кошелька / карты:</p>
          <input type="text" class="input-field" placeholder="0x..." style="margin-bottom: 12px;">
          <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px;">Сумма ($):</p>
          <input type="number" id="withdrawAmount" class="input-field" placeholder="50">
          <button class="submit-btn" style="margin-top: 12px;" onclick="processWithdraw()">Запросить вывод</button>
        `;
      } else if (type === 'transfer') {
        title.innerText = 'Внутренний перевод';
        body.innerHTML = `
          <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px;">ID получателя в Telegram:</p>
          <input type="text" class="input-field" placeholder="@username" style="margin-bottom: 12px;">
          <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px;">Сумма ($):</p>
          <input type="number" class="input-field" placeholder="10">
          <button class="submit-btn" style="margin-top: 12px;" onclick="alert('Перевод успешно отправлен!'); closeModal();">Перевести</button>
        `;
      } else if (type === 'history') {
        title.innerText = 'История транзакций';
        body.innerHTML = `
          <div class="history-list">
            <div class="history-item">
              <span>Пополнение (USDT)</span>
              <span class="val-plus">+$250.00</span>
            </div>
            <div class="history-item">
              <span>Вывод средств</span>
              <span class="val-minus">-$50.00</span>
            </div>
            <div class="history-item">
              <span>Пополнение (Card)</span>
              <span class="val-plus">+$1,034.56</span>
            </div>
          </div>
        `;
      }

      overlay.classList.add('active');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    function processDeposit() {
      const val = parseFloat(document.getElementById('depositAmount').value);
      if (val && val > 0) {
        currentBalance += val;
        updateBalanceDisplay();
        if (tg) tg.HapticFeedback?.notificationOccurred('success');
        alert(`Баланс успешно пополнен на $${val.toFixed(2)}`);
        closeModal();
      }
    }

    function processWithdraw() {
      const val = parseFloat(document.getElementById('withdrawAmount').value);
      if (val && val > 0 && val <= currentBalance) {
        currentBalance -= val;
        updateBalanceDisplay();
        if (tg) tg.HapticFeedback?.notificationOccurred('success');
        alert(`Заявка на вывод $${val.toFixed(2)} создана`);
        closeModal();
      } else {
        alert('Недостаточно средств или неверная сумма!');
      }
    }
  </script>
</body>
</html>
